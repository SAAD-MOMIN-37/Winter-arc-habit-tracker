<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b7ff4a"/>
      <stop offset="100%" stop-color="#42d66b"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle glass border -->
  <rect
    x="18"
    y="18"
    width="476"
    height="476"
    rx="98"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.08"
    stroke-width="4"
  />

  <!-- ARC symbol -->
  <path
    d="M128 342
       C137 226 189 156 256 156
       C323 156 375 226 384 342"
    fill="none"
    stroke="url(#accent)"
    stroke-width="38"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Progress/check mark -->
  <path
    d="M184 286 L231 333 L337 220"
    fill="none"
    stroke="#ffffff"
    stroke-width="27"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Small accent dots -->
  <circle cx="126" cy="374" r="7" fill="#8cff00"/>
  <circle cx="386" cy="374" r="7" fill="#8cff00"/>
</svg>
