<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050708">
  <meta name="description" content="Minimal glass habit, prayer, fitness and productivity tracker.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>ARC — Habit Tracker</title>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div>
      <div class="eyebrow">PERSONAL SYSTEM</div>
      <h1 id="greeting">Good evening 👋</h1>
      <p id="todayLabel"></p>
    </div>
    <button class="avatar" id="profileBtn" aria-label="Profile">A</button>
  </header>

  <main id="app">
    <section id="screen-home" class="screen active"></section>
    <section id="screen-progress" class="screen"></section>
    <section id="screen-goals" class="screen"></section>
    <section id="screen-history" class="screen"></section>
    <section id="screen-settings" class="screen"></section>
  </main>

  <nav class="bottom-nav">
    <button data-screen="home" class="nav-btn active"><span>⌂</span><small>Today</small></button>
    <button data-screen="progress" class="nav-btn"><span>⌁</span><small>Progress</small></button>
    <button data-screen="goals" class="nav-btn"><span>◎</span><small>Goals</small></button>
    <button data-screen="history" class="nav-btn"><span>▦</span><small>History</small></button>
    <button data-screen="settings" class="nav-btn"><span>⚙</span><small>Settings</small></button>
  </nav>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden"></div>
<script src="app.js"></script>
</body>
</html>
